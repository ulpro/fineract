# ==============================================================================
# Docker Compose Custom - Apache Fineract (Custom Backend)
# ==============================================================================
# Ce fichier est autonome (self-contained) et n'a besoin d'aucun autre fichier.
# Il utilise le mot de passe par défaut d'origine pour MariaDB.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Option 1: Base de données MariaDB (Activée par défaut)
  # ----------------------------------------------------------------------------
  db:
    image: mariadb:12.2
    container_name: fineract-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=skdcnwauicn2ucnaecasdsajdnizucawencascdca
    # Astuce d'initialisation en ligne pour créer automatiquement les 2 bases sans scripts externes
    entrypoint: >
      sh -c "
      echo 'CREATE DATABASE IF NOT EXISTS fineract_tenants; CREATE DATABASE IF NOT EXISTS fineract_default; GRANT ALL ON *.* TO \"root\"@\"%\";' > /docker-entrypoint-initdb.d/init.sql &&
      /usr/local/bin/docker-entrypoint.sh mariadbd
      "
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Serveur Fineract Backend (Custom)
  # ----------------------------------------------------------------------------
  fineract:
    image: fineract-backend-custom:latest
    container_name: fineract-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080" # Port HTTP non sécurisé
      - "8443:8443" # Port HTTPS sécurisé
    environment:
      # Mode SSL activé pour écouter sur le port 8443 (HTTPS)
      - FINERACT_SERVER_SSL_ENABLED=true
      - FINERACT_SERVER_PORT=8443

      # ------------------------------------------------------------------------
      # CONFIGURATION DE LA CONNEXION DATABASE
      # ------------------------------------------------------------------------
      - FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.mariadb.jdbc.Driver
      - FINERACT_HIKARI_JDBC_URL=jdbc:mariadb://db:3306/fineract_tenants
      - FINERACT_HIKARI_USERNAME=root
      - FINERACT_HIKARI_PASSWORD=skdcnwauicn2ucnaecasdsajdnizucawencascdca
      - FINERACT_DEFAULT_TENANTDB_PORT=3306
      - FINERACT_DEFAULT_TENANTDB_UID=root
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=db
      - FINERACT_DEFAULT_TENANTDB_PWD=skdcnwauicn2ucnaecasdsajdnizucawencascdca

      # Configuration du chemin des modèles de rapports Pentaho
      - FINERACT_PENTAHO_REPORTS_PATH=/app/pentahoReports
      
      # Configuration fuseau horaire
      - TZ=UTC
    volumes:
      # Montage des rapports Pentaho pour pouvoir les modifier à la volée sur le serveur
      - ./pentahoReports:/app/pentahoReports:ro
      # Montage des logs Fineract
      - fineract-logs:/var/logs/fineract

volumes:
  mariadb-data:
  fineract-logs:
