description = 'Mifos Fineract Pentaho Plugin'

group = 'org.apache.fineract.pentaho'

base {
    archivesName = 'fineract-pentaho-plugin'
}

dependencies {
    // Fineract dependencies
    implementation(project(':fineract-core'))
    implementation(project(':fineract-provider'))
    implementation(project(':fineract-cob'))
    implementation(project(':fineract-command'))
    implementation(project(':fineract-loan'))
    implementation(project(':fineract-savings'))
    implementation(project(':fineract-document'))
    implementation(project(':fineract-charge'))
    implementation(project(':fineract-tax'))
    implementation(project(':fineract-loan-origination'))
    implementation(project(':fineract-command-audit'))
    implementation(project(':fineract-command-jdbc'))
    implementation(project(':fineract-validation'))
    implementation(project(':fineract-investor'))
    implementation(project(':fineract-rates'))
    implementation(project(':fineract-report'))
    implementation(project(':fineract-security'))
    implementation(project(':fineract-mix'))
    implementation(project(':fineract-working-capital-loan'))
    implementation(project(':fineract-avro-schemas'))
    implementation(project(':fineract-branch'))
    implementation(project(':fineract-accounting'))
    implementation(project(':fineract-progressive-loan'))

    // Spring Boot & external libraries
    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('jakarta.ws.rs:jakarta.ws.rs-api')
    implementation('org.apache.commons:commons-lang3')
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa')
    implementation('org.glassfish.jersey.media:jersey-media-multipart')
    implementation('io.swagger.core.v3:swagger-annotations-jakarta')
    implementation('com.google.code.gson:gson')

    // Include all Pentaho reporting engine libraries
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
